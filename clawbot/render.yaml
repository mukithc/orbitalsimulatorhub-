# Render Blueprint - Clawbot Money Engine
# https://render.com/docs/blueprint-spec
# Use this if deploying clawbot as root. If inside HUBDEPOT, set Root Directory to "clawbot" in Render dashboard.

services:
  - type: web
    name: clawbot-money-engine
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: AGENT_SECRET
        sync: false
      - key: SITE_URL
        value: https://bot.hub-depot.com
